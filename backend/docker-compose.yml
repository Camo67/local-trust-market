version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: escrow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escrow_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - escrow_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: escrow_redis
    ports:
      - "6379:6379"
    networks:
      - escrow_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escrow_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/escrow_marketplace
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change_this_in_production}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - escrow_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escrow_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/escrow_marketplace
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change_this_in_production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - escrow_network
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info

  # Celery Beat (Scheduled Tasks)
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escrow_beat
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/escrow_marketplace
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - escrow_network
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info

networks:
  escrow_network:
    driver: bridge

volumes:
  postgres_data:
